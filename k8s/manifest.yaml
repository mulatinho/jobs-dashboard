apiVersion: v1
kind: Namespace
metadata:
  name: jobs-dashboard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jobs-dashboard-config
  namespace: jobs-dashboard
data:
  NAMESPACE: "jobs-dashboard"
  ENDPOINT: "/"
  MAX_JOBS: "10"
  OAUTH2_PROXY_ENABLED: "false"
  OAUTH2_PROXY_AUTH_URL: "http://oauth2-proxy.jobs-dashboard.svc.cluster.local:4180/oauth2/auth"
  AUTH_EMAIL_DOMAIN: "example.com"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobs-dashboard
  namespace: jobs-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jobs-dashboard
  namespace: jobs-dashboard
rules:
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jobs-dashboard
  namespace: jobs-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jobs-dashboard
subjects:
- kind: ServiceAccount
  name: jobs-dashboard
  namespace: jobs-dashboard
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: jobs-dashboard
  name: jobs-dashboard
  namespace: jobs-dashboard
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: jobs-dashboard
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-dashboard
  namespace: jobs-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobs-dashboard
  template:
    metadata:
      labels:
        app: jobs-dashboard
    spec:
      automountServiceAccountToken: true
      containers:
      - envFrom:
        - configMapRef:
            name: jobs-dashboard-config
        image: ghcr.io/your-org/jobs-dashboard:latest
        imagePullPolicy: Always
        name: dashboard
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      serviceAccountName: jobs-dashboard